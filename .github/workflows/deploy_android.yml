name: Deploy to Play Store (Internal) & Firebase Hosting (Prod)

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    name: Build & Deploy (Android + Web)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 'any'

      - name: 📦 Install dependencies
        working-directory: app
        run: flutter pub get

      # ─── Android Build ───────────────────────────────────────────────────────
      - name: 🔑 Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/android/app/upload-keystore.jks

      - name: 🏗️ Build App Bundle (AAB)
        working-directory: app
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_PATH: upload-keystore.jks
        run: |
          cp android/app/google-services-prod.json android/app/google-services.json
          flutter build appbundle --release \
            --dart-define=APP_ENV=prod \
            --dart-define=SUPER_ADMIN_EMAIL=stanworld@gmail.com \
            --build-number=${{ github.run_number }}

      # ─── Web Build (Prod) ─────────────────────────────────────────────────────
      - name: 🌐 Configure & Build Web (Prod)
        working-directory: app
        run: |
          # Générer index.html à partir du template
          cp web/index-template.html web/index.html
          sed -i "s|##GOOGLE_SIGNIN_CLIENT_ID_PLACEHOLDER##|48301164525-6lqqh5tc0m0jpsm4ovdpgalosve17a1m.apps.googleusercontent.com|g" web/index.html
          
          # S'assurer que la plateforme web est configurée
          flutter create . --platforms web
          
          # Build
          flutter build web --release \
            --dart-define=APP_ENV=prod \
            --dart-define=SUPER_ADMIN_EMAIL=stanworld@gmail.com

      # ─── Firebase Deploy (Firestore Rules + Hosting) ──────────────────────────
      - name: 🔥 Deploy Firestore Rules & Web Hosting to Prod
        run: |
          npm install -g firebase-tools
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}' > firebase-sa-prod.json
          export GOOGLE_APPLICATION_CREDENTIALS=firebase-sa-prod.json
          firebase deploy --only firestore:rules,hosting --project archipel-fortune-prod
          rm firebase-sa-prod.json

      # ─── Google Play Store ────────────────────────────────────────────────────
      - name: 🚀 Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_CREDENTIALS }}
          packageName: ${{ secrets.PACKAGE_NAME }}
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
