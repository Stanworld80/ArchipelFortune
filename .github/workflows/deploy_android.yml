name: Deploy to Play Store (Internal)

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    name: Build & Deploy to Play Console
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 'any'

      - name: 📦 Install dependencies
        working-directory: app
        run: flutter pub get

      - name: 🔑 Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/android/app/upload-keystore.jks

      - name: 🏗️ Build App Bundle (AAB)
        working-directory: app
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_PATH: upload-keystore.jks
        run: |
          cp android/app/google-services-prod.json android/app/google-services.json
          flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: 🚀 Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_CREDENTIALS }}
          packageName: ${{ secrets.PACKAGE_NAME }}
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: 🔥 Deploy Firestore Rules to Prod
        run: |
          npm install -g firebase-tools
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}" > firebase-sa-prod.json
          export GOOGLE_APPLICATION_CREDENTIALS=firebase-sa-prod.json
          firebase use prod
          firebase deploy --only firestore:rules --project archipel-fortune-prod
          rm firebase-sa-prod.json
