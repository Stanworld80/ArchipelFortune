name: CI/CD Prod

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy-prod:
    name: Build & Deploy to Prod (No tests)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'

      - name: 📦 Install dependencies
        working-directory: app
        run: flutter pub get

      - name: 🔑 Setup Keystore
        run: |
          # Nécessaire pour signer Android en release mode
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks || true
          echo "${{ secrets.KEY_PROPERTIES_PROD }}" | base64 --decode > android/key.prod.properties || true

      - name: 🚀 Deploy to Prod
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          # Déploiement prod: mode release, avec tests unitaires obligatoires
          bash build_deploy.sh -e prod -m release --bypasstest --no-git
