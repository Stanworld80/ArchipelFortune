name: CI/CD Prod

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: 

jobs:
  build-android:
    name: 🏗️ Build Android (Prod)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: 🔑 Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/android/app/upload-keystore.jks

      - name: 🏗️ Build App Bundle (AAB)
        working-directory: app
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_PATH: upload-keystore.jks
        run: |
          cp android/app/google-services.prod.json android/app/google-services.json
          flutter build appbundle --release \
            --dart-define=APP_ENV=prod \
            --dart-define=SUPER_ADMIN_EMAIL=stanworld@gmail.com \
            --build-number=${{ github.run_number }}

      - name: 📤 Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-prod
          path: app/build/app/outputs/bundle/release/app-release.aab

  build-web:
    name: 🌐 Build Web (Prod)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: 🌐 Configure & Build Web (Prod)
        working-directory: app
        run: |
          # Générer index.html à partir du template
          cp web/index-template.html web/index.html
          sed -i "s|##GOOGLE_SIGNIN_CLIENT_ID_PLACEHOLDER##|48301164525-6lqqh5tc0m0jpsm4ovdpgalosve17a1m.apps.googleusercontent.com|g" web/index.html
          
          # S'assurer que la plateforme web est configurée
          flutter create . --platforms web
          
          # Build
          flutter build web --release \
            --dart-define=APP_ENV=prod \
            --dart-define=SUPER_ADMIN_EMAIL=stanworld@gmail.com

      - name: 📤 Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-prod
          path: app/build/web

  deploy:
    name: 🚀 Deploy to Prod
    needs: [build-android, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-aab-prod
          path: artifacts/android

      - name: 📥 Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build-prod
          path: app/build/web

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}

      - name: 🔥 Deploy to Firebase (Rules, Indexes, Hosting)
        run: |
          # DEPLOY WITHOUT FUNCTIONS (Missing Billing on Prod project)
          npx firebase-tools deploy \
            --only firestore:rules,firestore:indexes,hosting \
            --project archipel-fortune-prod \
            --force

      - name: 🚀 Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_CREDENTIALS }}
          packageName: ${{ secrets.PACKAGE_NAME }}
          releaseFiles: artifacts/android/app-release.aab
          track: internal
          status: draft
