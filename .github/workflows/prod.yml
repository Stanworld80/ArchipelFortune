name: CI/CD Prod

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: 

jobs:
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: 🧪 Run Flutter tests
        working-directory: app
        run: flutter test

  build-android:
    name: 🏗️ Build Android (Prod)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
...
  build-web:
    name: 🌐 Build Web (Prod)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
...
  deploy-app:
    name: 🚀 Upload to Google Play
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-aab-prod
          path: artifacts/android

      - name: 🚀 Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_CREDENTIALS }}
          packageName: ${{ secrets.PACKAGE_NAME }}
          releaseFiles: artifacts/android/app-release.aab
          track: internal
          status: draft

  deploy-web:
    name: 🌐 Deploy Web & Rules (Prod)
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build-prod
          path: app/build/web

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}

      - name: 🔥 Deploy to Firebase (Rules, Indexes, Hosting)
        run: |
          npx firebase-tools deploy \
            --only firestore:rules,firestore:indexes,hosting \
            --project archipel-fortune-prod \
            --force
