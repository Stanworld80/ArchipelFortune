name: CI/CD Prod

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  unit-tests:
    name: 🧪 Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 'any'

      - name: 📦 Install dependencies
        working-directory: app
        run: flutter pub get

      - name: 🔍 Flutter Analyze
        working-directory: app
        run: flutter analyze

      - name: 🧪 Run Flutter tests
        working-directory: app
        run: flutter test

  build-android:
    name: 🏗️ Build Android (Prod)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 'any'

      - name: 📦 Install dependencies
        working-directory: app
        run: flutter pub get

      - name: 🔑 Setup Google Services (Prod)
        run: |
          cp app/android/app/google-services.prod.json app/android/app/google-services.json

      - name: 🔑 Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/android/app/upload-keystore.jks

      - name: 🏗️ Build Android App Bundle (Release/Prod)
        working-directory: app
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_PATH: upload-keystore.jks
        run: |
          flutter build appbundle --release \
            --dart-define=APP_ENV=prod \
            --dart-define=SUPER_ADMIN_EMAIL=stanworld@gmail.com \
            --build-number=${{ github.run_number }}

      - name: 📤 Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-prod
          path: app/build/app/outputs/bundle/release/app-release.aab

  build-web:
    name: 🌐 Build Web (Prod)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 'any'

      - name: 📦 Install dependencies
        working-directory: app
        run: flutter pub get

      - name: 🌐 Configure & Build Web (Prod)
        working-directory: app
        run: |
          # S'assurer que la plateforme web est configurée (faire avant de modifier index.html)
          flutter create . --platforms web
          
          # Générer index.html à partir du template
          cp web/index-template.html web/index.html
          sed -i "s|##GOOGLE_SIGNIN_CLIENT_ID_PLACEHOLDER##|83241971458-14tiragdibb39tnm9op5nd6fqnm4ct53.apps.googleusercontent.com|g" web/index.html
          
          # Build
          flutter build web --release \
            --dart-define=APP_ENV=prod \
            --dart-define=SUPER_ADMIN_EMAIL=stanworld@gmail.com

      - name: 📤 Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-prod
          path: app/build/web

  deploy-app:
    name: 📱 Deploy App to Play Store (Prod)
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-aab-prod
          path: artifacts/android

      - name: 🚀 Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlain: ${{ secrets.PLAY_STORE_CREDENTIALS }}
          packageName: com.stanworld.archipel_fortune
          releaseFiles: artifacts/android/app-release.aab
          track: internal
          status: completed

  deploy-web:
    name: 🌐 Deploy Web & Rules (Prod)
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build-prod
          path: app/build/web

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}

      - name: 🔥 Firebase Deploy Hosting & Rules
        run: |
          npx firebase-tools deploy --only hosting,firestore:rules --project archipel-fortune-prod

  integration-tests:
    name: 🦅 Integration Tests (Prod Check)
    needs: deploy-web
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 'any'
          cache: true

      - name: 📦 Install dependencies
        working-directory: app
        run: flutter pub get

      - name: 🧪 Run Integration Tests (Web)
        working-directory: app
        run: |
          flutter test integration_test/app_test.dart --platform chrome --web-renderer canvaskit
