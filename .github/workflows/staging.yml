name: CI/CD Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch: 

jobs:
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 'any'

      - name: 📦 Install dependencies
        working-directory: app
        run: flutter pub get

      - name: 🧪 Run Flutter tests
        working-directory: app
        run: flutter test

  build-android:
    name: 🏗️ Build Android (Staging)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
...
  build-web:
    name: 🌐 Build Web (Staging)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
...
  deploy-app:
    name: 📱 Deploy App to Tester (Staging)
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-aab-stg
          path: artifacts/android

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}

      - name: 🔥 Distribute Android App Bundle
        run: |
          APP_ID="${{ secrets.FIREBASE_ANDROID_APP_ID_STAGING }}"
          
          npx firebase-tools appdistribution:distribute artifacts/android/app-release.aab \
            --app "$APP_ID" \
            --groups "uat-testers" \
            --project archipel-fortune-stg

  deploy-web:
    name: 🌐 Deploy Web & Rules (Staging)
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build-stg
          path: app/build/web

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}

      - name: 🔥 Firebase Deploy Hosting & Rules
        run: |
          npx firebase-tools deploy --only hosting,firestore:rules --project archipel-fortune-stg
