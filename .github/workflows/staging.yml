name: CI/CD Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit-tests:
    name: 🧪 Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 'any'

      - name: 📦 Install dependencies
        working-directory: app
        run: flutter pub get

      - name: 🔍 Flutter Analyze
        working-directory: app
        run: flutter analyze

      - name: 🧪 Run Flutter tests
        working-directory: app
        run: flutter test

  build-android:
    name: 🏗️ Build Android (Staging)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 'any'

      - name: 📦 Install dependencies
        working-directory: app
        run: flutter pub get

      - name: 🔑 Setup Google Services (Staging/Fallback Dev)
        run: |
          if [ -f app/android/app/google-services.staging.json ]; then
            cp app/android/app/google-services.staging.json app/android/app/google-services.json
          else
            echo "⚠️ Staging google-services not found, using dev one"
            cp app/android/app/google-services.dev.json app/android/app/google-services.json
          fi

      - name: 🔑 Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/android/app/upload-keystore.jks

      - name: 🏗️ Build Android APK (Release/Staging)
        working-directory: app
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_PATH: upload-keystore.jks
        run: |
          flutter build apk --release \
            --dart-define=APP_ENV=staging \
            --dart-define=SUPER_ADMIN_EMAIL=stanworld@gmail.com \
            --build-number=${{ github.run_number }}

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-staging
          path: app/build/app/outputs/flutter-apk/app-release.apk

  build-web:
    name: 🌐 Build Web (Staging)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 'any'

      - name: 📦 Install dependencies
        working-directory: app
        run: flutter pub get

      - name: 🌐 Configure & Build Web (Staging)
        working-directory: app
        run: |
          # S'assurer que la plateforme web est configurée (faire avant de modifier index.html)
          flutter create . --platforms web
          
          # Générer index.html à partir du template
          cp web/index-template.html web/index.html
          sed -i "s|##GOOGLE_SIGNIN_CLIENT_ID_PLACEHOLDER##|83241971458-14tiragdibb39tnm9op5nd6fqnm4ct53.apps.googleusercontent.com|g" web/index.html
          
          # Build
          flutter build web --release \
            --dart-define=APP_ENV=staging \
            --dart-define=SUPER_ADMIN_EMAIL=stanworld@gmail.com

      - name: 📤 Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-staging
          path: app/build/web

  deploy-app:
    name: 📱 Deploy App to Tester (Staging)
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk-staging
          path: artifacts/android

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}

      - name: 🔥 Distribute Android APK
        run: |
          APP_ID="${{ secrets.FIREBASE_ANDROID_APP_ID_STAGING }}"
          RELEASE_NOTES="Staging Build: ${{ github.event.head_commit.message }}"
          
          npx firebase-tools appdistribution:distribute artifacts/android/app-release.apk \
            --app "$APP_ID" \
            --groups "testers" \
            --release-notes "$RELEASE_NOTES" \
            --project archipel-fortune-staging

  deploy-web:
    name: 🌐 Deploy Firebase Services (Staging)
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build-staging
          path: app/build/web

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}

      - name: 📦 Install Functions Dependencies
        working-directory: functions
        run: npm ci

      - name: 🔥 Firebase Deploy Rules & Indexes (Staging)
        run: |
          npx firebase-tools deploy --only firestore:rules,firestore:indexes --project archipel-fortune-staging

      - name: 🔥 Firebase Deploy Functions (Staging)
        continue-on-error: true
        run: |
          npx firebase-tools deploy --only functions --project archipel-fortune-staging

      - name: 🔥 Firebase Deploy Hosting (Staging)
        run: |
          npx firebase-tools deploy --only hosting --project archipel-fortune-staging

  e2e-tests:
    name: 🎭 E2E Tests (Staging)
    needs: deploy-web
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: tests_e2e/package-lock.json

      - name: 📦 Install dependencies
        working-directory: tests_e2e
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        working-directory: tests_e2e
        run: npx playwright install --with-deps

      - name: 🚀 Run E2E Tests (Staging)
        working-directory: tests_e2e
        run: npm run test:staging

      - name: 📤 Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-staging
          path: tests_e2e/playwright-report/
          retention-days: 30

  integration-tests:
    name: 🦅 Integration Tests (Staging)
    needs: deploy-web
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 'any'
          cache: true

      - name: 📦 Install dependencies
        working-directory: app
        run: flutter pub get

      - name: 🧪 Run Integration Tests (Web)
        working-directory: app
        run: |
          xvfb-run -a flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart -d chrome
