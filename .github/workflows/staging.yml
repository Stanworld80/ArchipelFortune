name: CI/CD Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch: 

jobs:
  build-test-deploy-staging:
    name: Build, Test & Deploy (Android + Web) to Staging
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 'any'

      - name: 📦 Install dependencies
        working-directory: app
        run: flutter pub get

      - name: 🔑 Setup Google Services (Staging)
        run: |
          # Fallback to dev if staging is missing, until the user provides google-services.staging.json
          if [ -f app/android/app/google-services.staging.json ]; then
            cp app/android/app/google-services.staging.json app/android/app/google-services.json
          else
            echo "WARNING: google-services.staging.json missing, falling back to dev version"
            cp app/android/app/google-services.dev.json app/android/app/google-services.json
          fi

      - name: 🔑 Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/android/app/upload-keystore.jks

      - name: 🏗️ Build App Bundle (AAB - Staging)
        working-directory: app
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_PATH: upload-keystore.jks
        run: |
          flutter build appbundle --release \
            --dart-define=APP_ENV=staging \
            --dart-define=SUPER_ADMIN_EMAIL=stanworld@gmail.com \
            --build-number=${{ github.run_number }}

      - name: 🌐 Configure & Build Web (Staging)
        working-directory: app
        run: |
          # Générer index.html à partir du template
          cp web/index-template.html web/index.html
          sed -i "s|##GOOGLE_SIGNIN_CLIENT_ID_PLACEHOLDER##|344541548510-k1vncr9ufjii7r3k4425p8sqgq5p47r6.apps.googleusercontent.com|g" web/index.html
          
          # S'assurer que la plateforme web est configurée
          flutter create . --platforms web
          
          # Build
          flutter build web --release \
            --dart-define=APP_ENV=staging \
            --dart-define=SUPER_ADMIN_EMAIL=stanworld@gmail.com

      - name: 🔥 Firebase Deploy & Distribute
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}' > firebase-sa-stg.json
          export GOOGLE_APPLICATION_CREDENTIALS=firebase-sa-stg.json
          
          # Deploy hosting and rules
          npx firebase-tools deploy --only hosting,firestore:rules --project archipel-fortune-stg
          
          # Distribute Android App Bundle
          APP_ID="${{ secrets.FIREBASE_ANDROID_APP_ID_STAGING }}"
          echo "Distributing to App ID ending in: ${APP_ID: -8}"
          
          npx firebase-tools appdistribution:distribute app/build/app/outputs/bundle/release/app-release.aab \
            --app "$APP_ID" \
            --groups "uat-testers" \
            --project archipel-fortune-stg
          
          rm firebase-sa-stg.json
