name: CI/CD Dev

on:
  push:
    branches:
      - develop
  workflow_dispatch: 
    inputs:
      run_unit-tests:
        description: 'Run Unit_Tests ?'
        type: boolean
        default: true
      run_android:
        description: 'Build Android ?'
        type: boolean
        default: true
      run_web:
        description: 'Build Web ?'
        type: boolean
        default: true
      run_e2e:
        description: 'Run E2E Tests ?'
        type: boolean
        default: false
      run_integration-tests:
        description: 'Run Integration Tests ?'
        type: boolean
        default: true

jobs:
  unit-tests:
    if: github.event_name == 'push' || inputs.run_unit-tests == true
    name: 🧪 Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 'any'
          cache: true

      - name: 🔍 Diagnostics
        run: flutter --version

      - name: 📦 Install dependencies
        working-directory: app
        run: flutter pub get

      - name: 🔍 Flutter Analyze
        working-directory: app
        run: flutter analyze

      - name: 🧪 Run Flutter tests
        working-directory: app
        run: flutter test

  build-android:
    name: 🏗️ Build Android (Dev)
    if: github.event_name == 'push' || inputs.run_android == true
    #needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 'any'

      - name: 📦 Install dependencies
        working-directory: app
        run: flutter pub get

      - name: 🔑 Setup Google Services (Dev)
        run: |
          cp app/android/app/google-services.dev.json app/android/app/google-services.json

      - name: 🔑 Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/android/app/upload-keystore.jks

      - name: 🏗️ Build Android APK (Release/Dev)
        working-directory: app
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_PATH: upload-keystore.jks
        run: |
          flutter build apk --release \
            --dart-define=APP_ENV=dev \
            --dart-define=SUPER_ADMIN_EMAIL=stantest@stanworld.org \
            --build-number=${{ github.run_number }}

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-dev
          path: app/build/app/outputs/flutter-apk/app-release.apk

  build-web:
    name: 🌐 Build Web (Dev)
    if: github.event_name == 'push' || inputs.run_web == true
    #needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 'any'

      - name: 📦 Install dependencies
        working-directory: app
        run: flutter pub get

      - name: 🌐 Configure & Build Web (Dev)
        working-directory: app
        run: |
          # S'assurer que la plateforme web est configurée (faire avant de modifier index.html)
          flutter create . --platforms web
          
          # Générer index.html à partir du template
          cp web/index-template.html web/index.html
          sed -i "s|##GOOGLE_SIGNIN_CLIENT_ID_PLACEHOLDER##|83241971458-14tiragdibb39tnm9op5nd6fqnm4ct53.apps.googleusercontent.com|g" web/index.html
          
          # Build
          flutter build web --profile \
            --dart-define=APP_ENV=dev \
            --dart-define=SUPER_ADMIN_EMAIL=stantest@stanworld.org \
            --source-maps

      - name: 📤 Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-dev
          path: app/build/web

  deploy-app:
    name: 📱 Deploy App to Tester (Dev)
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk-dev
          path: artifacts/android

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}

      - name: 🔥 Distribute Android APK
        run: |
          APP_ID="${{ secrets.FIREBASE_ANDROID_APP_ID_DEV }}"
          RELEASE_NOTES="Dev Build: ${{ github.event.head_commit.message }}"
          
          npx firebase-tools appdistribution:distribute artifacts/android/app-release.apk \
            --app "$APP_ID" \
            --groups "dev-team" \
            --release-notes "$RELEASE_NOTES" \
            --project archipel-fortune-dev

  deploy-web:
    name: 🌐 Deploy Firebase Services (Dev)
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build-dev
          path: app/build/web

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}

      - name: 📦 Install Functions Dependencies
        working-directory: functions
        run: npm ci

      - name: 🔥 Firebase Deploy Rules & Indexes (Dev)
        run: |
          npx firebase-tools deploy --only firestore:rules,firestore:indexes --project archipel-fortune-dev

      - name: 🔥 Firebase Deploy Functions (Dev)
        continue-on-error: true
        run: |
          npx firebase-tools deploy --only functions --project archipel-fortune-dev

      - name: 🔥 Firebase Deploy Hosting (Dev)
        run: |
          npx firebase-tools deploy --only hosting --project archipel-fortune-dev

  e2e-tests:
    name: 🎭 E2E Tests (Dev)
    if : github.event_name == 'push' || inputs.run_e2e == true
    needs: [deploy-web, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: tests_e2e/package-lock.json

      - name: 📦 Install dependencies
        working-directory: tests_e2e
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        working-directory: tests_e2e
        run: npx playwright install --with-deps

      - name: 🚀 Run E2E Tests (Dev)
        working-directory: tests_e2e
        run: npm run test:dev

      - name: 📤 Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-dev
          path: tests_e2e/playwright-report/
          retention-days: 30

  integration-tests:
    name: 🦅 Integration Tests (Dev)
    if: github.event_name == 'push' || inputs.run_integration-tests == true
    needs: [deploy-web, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 'any'
          cache: true

      - name: 📦 Install dependencies
        working-directory: app
        run: flutter pub get

      - name: 🧪 Run Integration Tests (Web)
        working-directory: app
        run: |
          # Integration tests on web require the app to be built or at least ready
          flutter test integration_test/app_test.dart --platform chrome
