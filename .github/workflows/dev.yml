name: CI/CD Dev

on:
  push:
    branches:
      - develop
  workflow_dispatch: 

jobs:
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 'any'

      - name: 📦 Install dependencies
        working-directory: app
        run: flutter pub get

      - name: 🧪 Run Flutter tests
        working-directory: app
        run: flutter test

  build-android:
    name: 🏗️ Build Android (Dev)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
...
  build-web:
    name: 🌐 Build Web (Dev)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
...
  deploy-app:
    name: 📱 Deploy App to Tester (Dev)
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk-dev
          path: artifacts/android

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}

      - name: 🔥 Distribute Android APK
        run: |
          APP_ID="${{ secrets.FIREBASE_ANDROID_APP_ID_DEV }}"
          RELEASE_NOTES="Dev Build: ${{ github.event.head_commit.message }}"
          
          npx firebase-tools appdistribution:distribute artifacts/android/app-release.apk \
            --app "$APP_ID" \
            --groups "dev-testers" \
            --release-notes "$RELEASE_NOTES" \
            --project archipel-fortune-dev

  deploy-web:
    name: 🌐 Deploy Web & Rules (Dev)
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build-dev
          path: app/build/web

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}

      - name: 🔥 Firebase Deploy Hosting & Rules
        run: |
          npx firebase-tools deploy --only hosting,firestore:rules --project archipel-fortune-dev
