name: CI/CD Dev

on:
  push:
    branches:
      - develop
  workflow_dispatch: 

jobs:
  build-test-deploy-dev:
    name: Build, Test & Deploy (Android + Web) to Dev
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 'any'

      - name: 📦 Install dependencies
        working-directory: app
        run: flutter pub get

      - name: 🔑 Setup Google Services (Dev)
        run: |
          cp app/android/app/google-services.dev.json app/android/app/google-services.json

      - name: 🏗️ Build Android APK (Debug/Dev)
        working-directory: app
        run: |
          flutter build apk --debug \
            --dart-define=APP_ENV=dev \
            --dart-define=SUPER_ADMIN_EMAIL=stanworld@gmail.com

      - name: 🌐 Configure & Build Web (Dev)
        working-directory: app
        run: |
          # Générer index.html à partir du template
          cp web/index-template.html web/index.html
          sed -i "s|##GOOGLE_SIGNIN_CLIENT_ID_PLACEHOLDER##|83241971458-14tiragdibb39tnm9op5nd6fqnm4ct53.apps.googleusercontent.com|g" web/index.html
          
          # S'assurer que la plateforme web est configurée
          flutter create . --platforms web
          
          # Build
          flutter build web --debug \
            --dart-define=APP_ENV=dev \
            --dart-define=SUPER_ADMIN_EMAIL=stanworld@gmail.com

      - name: 🔥 Firebase Deploy & Distribute
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}' > firebase-sa-dev.json
          export GOOGLE_APPLICATION_CREDENTIALS=firebase-sa-dev.json
          
          # Deploy hosting and rules
          npx firebase-tools deploy --only hosting,firestore:rules --project archipel-fortune-dev
          
          # Distribute Android APK
          npx firebase-tools appdistribution:distribute app/build/app/outputs/flutter-apk/app-debug.apk \
            --app "${{ secrets.FIREBASE_ANDROID_APP_ID_DEV }}" \
            --groups "dev-testers" \
            --project archipel-fortune-dev
          
          rm firebase-sa-dev.json
